<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>써밋리그 복식 팀편성</title>
    <style>
        :root {
            --primary: #007bff;
            --bg: #f8f9fa;
            --match-bg: #ffffff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 600px; margin: auto; background-color: var(--bg); color: #333; line-height: 1.5; }
        h2 { text-align: center; margin-top: 10px; margin-bottom: 20px; font-size: 1.4rem; }
        .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.95rem; }
        .input-group input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; -webkit-appearance: none; }
        .input-group .help { font-size: 11px; color: #6c757d; margin-top: 2px; }
        .num-inputs { display: flex; justify-content: space-between; gap: 8px; }
        .num-inputs div { flex: 1; text-align: center; }
        .num-inputs label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px; }
        .num-inputs input { width: 100%; padding: 8px; font-size: 16px; text-align: center; border: 1px solid #ccc; border-radius: 8px; -webkit-appearance: none; }
        button { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.8; }
        
        .team-card { background: white; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.04); border-left: 5px solid var(--primary); }
        .team-header { font-weight: bold; font-size: 0.95em; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .team-members { font-size: 1em; word-break: break-all; }
        
        /* 대진표 전용 스타일 */
        .match-card { background: var(--match-bg); border-radius: 10px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border: 1px solid #e9ecef; }
        .match-title { font-size: 0.85rem; font-weight: bold; color: #6c757d; margin-bottom: 6px; }
        .match-body { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
        .match-team { flex: 1; text-align: center; font-weight: bold; }
        .match-vs { width: 40px; text-align: center; color: #d9534f; font-weight: bold; font-size: 0.85rem; }
        .score-input { width: 42px; padding: 5px; text-align: center; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }

        /* 순위표 전용 스타일 */
        .rank-table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-top: 10px; }
        .rank-table th, .rank-table td { padding: 10px 6px; text-align: center; font-size: 0.88rem; border-bottom: 1px solid #eee; }
        .rank-table th { background-color: #f1f3f5; font-weight: bold; color: #495057; }
        .rank-table tr:first-child td { font-weight: bold; color: #007bff; background-color: #f0f7ff; }

        .rest-card { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 12px; border-radius: 10px; margin-top: 15px; font-size: 0.95rem; }
        .warn { color: #dc3545; text-align: center; font-weight: bold; padding: 10px; }
        .section-title { font-size: 1.15rem; margin: 20px 0 10px 0; border-bottom: 2px solid #007bff; padding-bottom: 5px; color: #007bff; }
    </style>
</head>
<body>

    <h2>🏓 써밋리그 복식 팀편성</h2>

    <div class="card">
        <div class="input-group">
            <label>1그룹. A1 명단 (쉼표 구분)</label>
            <input type="text" id="highNames" placeholder="예: 김탁구, 이탁구">
            <div class="help">비워두면 아래 숫자 인원수로 생성됩니다.</div>
        </div>
        <div class="input-group">
            <label>2그룹. A2 명단 (쉼표 구분)</label>
            <input type="text" id="midNames" placeholder="예: 박탁구, 최탁구">
        </div>
        <div class="input-group">
            <label>3그룹. A3 명단 (쉼표 구분)</label>
            <input type="text" id="lowNames" placeholder="예: 정탁구, 강탁구">
        </div>

        <hr style="border:0; border-top:1px solid #eee; margin:12px 0;">

        <div class="num-inputs">
            <div>
                <label>A1 (명)</label>
                <input type="number" id="highCount" value="4" min="0">
            </div>
            <div>
                <label>A2 (명)</label>
                <input type="number" id="midCount" value="4" min="0">
            </div>
            <div>
                <label>A3 (명)</label>
                <input type="number" id="lowCount" value="4" min="0">
            </div>
        </div>

        <br>
        <button type="button" id="btnGenerate">팀 & 리그 대진표 만들기 🚀</button>
    </div>

    <div id="result"></div>

    <script>
        var currentTeams = []; // 전역 팀 데이터 배열 저장

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("btnGenerate").addEventListener("click", generateTeams);
        });

        function parseInput(inputId, countId, prefix) {
            var text = document.getElementById(inputId).value.trim();
            if (text.length > 0) {
                var arr = text.split(',');
                var res = [];
                for (var i = 0; i < arr.length; i++) {
                    var name = arr[i].trim();
                    if (name.length > 0) res.push(name);
                }
                return res;
            } else {
                var count = parseInt(document.getElementById(countId).value) || 0;
                var list = [];
                for (var j = 1; j <= count; j++) {
                    list.push(prefix + '-' + j);
                }
                return list;
            }
        }

        function shuffle(array) {
            var currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                var temp = array[currentIndex];
                array[currentIndex] = array[randomIndex];
                array[randomIndex] = temp;
            }
            return array;
        }

        function generateTeams() {
            var highs = shuffle(parseInput('highNames', 'highCount', 'A1'));
            var mids = shuffle(parseInput('midNames', 'midCount', 'A2'));
            var lows = shuffle(parseInput('lowNames', 'lowCount', 'A3'));

            var total = highs.length + mids.length + lows.length;
            var resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "";

            if (total < 4) {
                resultDiv.innerHTML = "<div class='card warn'>⚠️ 최소 4명 이상이어야 복식 팀 편성이 가능합니다.</div>";
                return;
            }

            var teams = [];

            // [우선순위 1] A1 + A3 매칭
            while (highs.length > 0 && lows.length > 0) {
                teams.push({ p1: highs.pop(), p2: lows.pop() });
            }
            // [우선순위 2] A2 + A2 매칭
            while (mids.length >= 2) {
                teams.push({ p1: mids.pop(), p2: mids.pop() });
            }
            // [우선순위 3] 남은 A1 + A2 매칭
            while (highs.length > 0 && mids.length > 0) {
                teams.push({ p1: highs.pop(), p2: mids.pop() });
            }
            // [우선순위 4] 남은 A2 + A3 매칭
            while (mids.length > 0 && lows.length > 0) {
                teams.push({ p1: mids.pop(), p2: lows.pop() });
            }

            // 남은 인원 처리
            var remaining = [];
            while(highs.length > 0) remaining.push(highs.pop());
            while(mids.length > 0) remaining.push(mids.pop());
            while(lows.length > 0) remaining.push(lows.pop());

            while (remaining.length >= 2) {
                var p1 = remaining.pop();
                var p2 = remaining.pop();
                teams.push({ p1: p1, p2: p2 });
            }

            // 구성된 팀 무작위 셔플
            teams = shuffle(teams);
            currentTeams = teams; // 저장

            var html = '<div class="section-title">📋 복식 팀 구성 (' + teams.length + '개 팀)</div>';

            for (var k = 0; k < teams.length; k++) {
                var t = teams[k];
                html += '<div class="team-card">' +
                            '<div class="team-header">' +
                                '<span>' + (k + 1) + '팀</span>' +
                            '</div>' +
                            '<div class="team-members">' +
                                '👤 ' + t.p1 + ' &nbsp;+&nbsp; 👤 ' + t.p2 +
                            '</div>' +
                        '</div>';
            }

            if (remaining.length > 0) {
                html += '<div class="rest-card">' +
                            '<strong>⚠️ 대기/휴식 인원 (' + remaining.length + '명):</strong><br>' +
                            remaining.join(', ') +
                        '</div>';
            }

            // 대진표 및 순위표 영역 생성
            if (teams.length >= 2) {
                html += '<div class="section-title">🏆 실시간 순위표</div>' +
                        '<div id="rankContainer"></div>';

                html += '<div class="section-title">⚔️ 풀리그 대진표 (' + (teams.length * (teams.length - 1) / 2) + '경기)</div>';
                
                var matchCount = 1;
                for (var i = 0; i < teams.length; i++) {
                    for (var j = i + 1; j < teams.length; j++) {
                        html += '<div class="match-card">' +
                                    '<div class="match-title">GAME ' + matchCount + '</div>' +
                                    '<div class="match-body">' +
                                        '<div class="match-team">' + (i + 1) + '팀<br><small style="font-weight:normal; font-size:12px; color:#666;">(' + teams[i].p1 + ', ' + teams[i].p2 + ')</small></div>' +
                                        '<div><input type="number" class="score-input" data-t1="' + i + '" data-t2="' + j + '" data-side="1" min="0" oninput="updateRankings()"></div>' +
                                        '<div class="match-vs">VS</div>' +
                                        '<div><input type="number" class="score-input" data-t1="' + i + '" data-t2="' + j + '" data-side="2" min="0" oninput="updateRankings()"></div>' +
                                        '<div class="match-team">' + (j + 1) + '팀<br><small style="font-weight:normal; font-size:12px; color:#666;">(' + teams[j].p1 + ', ' + teams[j].p2 + ')</small></div>' +
                                    '</div>' +
                                '</div>';
                        matchCount++;
                    }
                }
            }

            resultDiv.innerHTML = html;
            updateRankings(); // 초기 순위표 표시
        }

        // 실시간 순위 산출 함수
        function updateRankings() {
            var n = currentTeams.length;
            if (n < 2) return;

            // 각 팀별 전적 데이터 구조 초기화
            var stats = [];
            for (var i = 0; i < n; i++) {
                stats.push({
                    teamIdx: i + 1,
                    players: currentTeams[i].p1 + ', ' + currentTeams[i].p2,
                    win: 0,
                    loss: 0,
                    draw: 0,
                    scoreFor: 0,
                    scoreAgainst: 0,
                    diff: 0
                });
            }

            // 대진표 스코어 입력값 전부 가져와 계산
            var inputs = document.querySelectorAll('.score-input');
            for (var k = 0; k < inputs.length; k += 2) {
                var inp1 = inputs[k];
                var inp2 = inputs[k + 1];

                if (inp1 && inp2 && inp1.value !== "" && inp2.value !== "") {
                    var s1 = parseInt(inp1.value) || 0;
                    var s2 = parseInt(inp2.value) || 0;

                    var t1 = parseInt(inp1.getAttribute('data-t1'));
                    var t2 = parseInt(inp1.getAttribute('data-t2'));

                    stats[t1].scoreFor += s1;
                    stats[t1].scoreAgainst += s2;
                    stats[t2].scoreFor += s2;
                    stats[t2].scoreAgainst += s1;

                    if (s1 > s2) {
                        stats[t1].win += 1;
                        stats[t2].loss += 1;
                    } else if (s2 > s1) {
                        stats[t2].win += 1;
                        stats[t1].loss += 1;
                    } else {
                        stats[t1].draw += 1;
                        stats[t2].draw += 1;
                    }
                }
            }

            // 득실차 계산
            for (var m = 0; m < n; m++) {
                stats[m].diff = stats[m].scoreFor - stats[m].scoreAgainst;
            }

            // 정렬: 1순위 승수(승점), 2순위 득실차, 3순위 총 득점
            stats.sort(function(a, b) {
                if (b.win !== a.win) return b.win - a.win;
                if (b.diff !== a.diff) return b.diff - a.diff;
                return b.scoreFor - a.scoreFor;
            });

            // 순위표 HTML 생성
            var html = '<table class="rank-table">' +
                        '<thead>' +
                            '<tr>' +
                                '<th>순위</th>' +
                                '<th>팀</th>' +
                                '<th>선수 명단</th>' +
                                '<th>승</th>' +
                                '<th>패</th>' +
                                '<th>득실차</th>' +
                            '</tr>' +
                        '</thead>' +
                        '<tbody>';

            for (var r = 0; r < stats.length; r++) {
                var st = stats[r];
                var diffStr = (st.diff > 0 ? '+' : '') + st.diff;
                html += '<tr>' +
                            '<td>' + (r + 1) + '위</td>' +
                            '<td>' + st.teamIdx + '팀</td>' +
                            '<td>' + st.players + '</td>' +
                            '<td>' + st.win + '</td>' +
                            '<td>' + st.loss + '</td>' +
                            '<td>' + diffStr + '</td>' +
                        '</tr>';
            }

            html += '</tbody></table>';

            var container = document.getElementById('rankContainer');
            if (container) container.innerHTML = html;
        }
    </script>
</body>
</html>
